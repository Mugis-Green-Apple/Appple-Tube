<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple-tube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --bg-2: #18181b;
      --bg-3: #27272a;
      --border: #3f3f46;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --red: #dc2626;
      --red-light: #f87171;
    }

    body {
      font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
    }

    button, input, select { font: inherit; color: inherit; }
    button { background: none; border: none; cursor: pointer; }
    .hidden { display: none !important; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(9, 9, 11, 0.95);
      backdrop-filter: blur(8px);
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 50%;
      font-size: 18px;
      position: relative;
    }
    .icon-btn:hover { background: var(--bg-3); }
    .logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; cursor: pointer; }
    .logo-mark {
      width: 36px; height: 24px;
      background: var(--red);
      border-radius: 7px;
      display: grid; place-items: center;
    }
    .logo-mark::after {
      content: "";
      border-left: 9px solid #fff;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      margin-left: 2px;
    }
    .search {
      display: flex;
      flex: 1;
      max-width: 560px;
      margin: 0 32px;
      gap: 12px;
      align-items: center;
    }
    .search-box {
      display: flex;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-2);
      overflow: hidden;
    }
    .search-box:focus-within { border-color: var(--red); }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 8px 16px;
      min-width: 0;
    }
    .search-box input::placeholder { color: #71717a; }
    .search-box button {
      padding: 0 20px;
      background: var(--bg-3);
      border-left: 1px solid var(--border);
    }
    .search-box button:hover { background: #3f3f46; }
    .mic-btn { background: var(--bg-2); width: 40px; height: 40px; border-radius: 50%; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--red);
      display: grid; place-items: center;
      font-size: 14px;
      font-weight: 700;
    }
    .notify-dot {
      position: absolute;
      top: 8px; right: 8px;
      width: 8px; height: 8px;
      background: var(--red);
      border-radius: 50%;
      display: none;
    }
    .search-mobile { display: none; }
    .search-mobile-row {
      display: none;
      padding: 8px 12px;
      background: var(--bg);
    }
    .search-mobile-row.open { display: block; }
    .search-mobile-row input {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 16px;
      outline: none;
    }
    .search-mobile-row input:focus { border-color: var(--red); }

    /* Layout */
    .layout { display: flex; }

    /* Sidebar */
    aside {
      width: 240px;
      flex-shrink: 0;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
      padding: 8px 12px;
    }
    aside.hidden { display: none; }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 10px 12px;
      border-radius: 8px;
      text-align: left;
      font-size: 14px;
    }
    .nav-item:hover { background: var(--bg-3); }
    .nav-item.active { background: var(--bg-3); color: var(--red-light); font-weight: 600; }
    .section {
      border-bottom: 1px solid #27272a;
      padding: 12px 0;
    }
    .section:last-child { border-bottom: none; }
    .section-title { padding: 4px 12px 8px; font-size: 15px; font-weight: 600; }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      min-width: 0;
    }
    .channel-item:hover { background: var(--bg-3); }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    /* Avatars */
    .av, .card-avatar, .av-md, .av-lg, .av-xl {
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, #b91c1c, #27272a);
      display: block;
    }
    .av { width: 24px; height: 24px; }
    .card-avatar { width: 36px; height: 36px; }
    .av-md { width: 40px; height: 40px; }
    .av-lg { width: 56px; height: 56px; }
    .av-xl { width: 96px; height: 96px; }

    /* Main */
    main {
      flex: 1;
      min-width: 0;
      padding: 8px 24px 32px;
    }
    .chips {
      position: sticky;
      top: 56px;
      z-index: 10;
      background: var(--bg);
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 8px 0 12px;
      scrollbar-width: none;
    }
    .chip {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--bg-3);
      white-space: nowrap;
      font-size: 14px;
    }
    .chip:hover { background: #3f3f46; }
    .chip.active { background: var(--red); color: #fff; font-weight: 600; }

    .page-title { font-size: 18px; font-weight: 700; padding: 16px 0 4px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 32px 16px;
      padding-top: 16px;
    }
    .stack { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; }
    .card { cursor: pointer; }
    .thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
    }
    .thumb img, .side-thumb img, .banner img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .thumb img { position: absolute; inset: 0; transition: transform 0.2s; }
    .card:hover .thumb img { transform: scale(1.03); }
    .play-overlay {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .play-overlay { opacity: 1; }
    .play-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      display: grid; place-items: center;
      font-size: 22px;
    }
    .duration {
      position: absolute;
      right: 8px; bottom: 8px;
      background: rgba(0,0,0,0.85);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    .duration.live { background: var(--red); }
    .card-body { display: flex; gap: 12px; margin-top: 12px; }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card:hover .card-title { color: var(--red-light); }
    .card-channel, .card-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card-channel:hover { color: var(--text); }
    .clamp {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty { grid-column: 1 / -1; text-align: center; color: #71717a; padding: 48px 0; }
    .retry-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: var(--red);
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
    }

    /* Channel row */
    .channel-row {
      display: flex;
      gap: 16px;
      align-items: center;
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-2);
      margin-top: 16px;
      cursor: pointer;
    }
    .channel-row:hover { background: var(--bg-3); }
    .ch-name { font-weight: 600; font-size: 15px; }

    /* Watch */
    .watch { display: flex; gap: 24px; padding-top: 16px; align-items: flex-start; }
    .watch-main { flex: 1; min-width: 0; }
    .watch-side { width: 402px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .player {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    .player video, .player iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .player audio { display: none; }
    .player-msg {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      color: var(--muted);
    }
    .player-loading {
      position: absolute; inset: 0;
      z-index: 2;
      display: grid; place-items: center;
      background: rgba(0,0,0,0.64);
      color: #fff;
    }
    .loading-content { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 16px; }
    .loading-spinner {
      width: 38px; height: 38px;
      border: 4px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cache-badge {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 3;
      background: rgba(0,0,0,0.7);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #86efac;
      pointer-events: none;
    }
    .dl-track {
      width: min(360px, 80%);
      height: 6px;
      background: var(--bg-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .dl-bar { width: 0%; height: 100%; background: var(--red); transition: width 0.2s; }
    .watch-title { font-size: 18px; font-weight: 700; margin-top: 12px; line-height: 1.4; }
    .watch-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .watch-ch { display: flex; gap: 12px; align-items: center; cursor: pointer; }
    .watch-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sub-btn {
      padding: 8px 16px;
      border-radius: 999px;
      background: #f4f4f5;
      color: #09090b;
      font-weight: 600;
    }
    .sub-btn.on { background: var(--bg-3); color: var(--text); }
    .pill { padding: 8px 14px; border-radius: 999px; background: var(--bg-3); }
    .mode-btn { padding: 8px 14px; border-radius: 999px; background: var(--bg-3); font-size: 13px; }
    .mode-btn:hover { background: #3f3f46; }
    .q-select {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--bg-3);
      font-size: 13px;
      border: 0;
    }
    .q-select:disabled { opacity: .6; }
    .desc-box {
      margin-top: 12px;
      background: var(--bg-2);
      border-radius: 12px;
      padding: 12px;
      line-height: 1.6;
    }
    .desc { white-space: pre-wrap; word-break: break-word; margin-top: 8px; }
    .comments h2 { font-size: 16px; margin: 24px 0 12px; }
    .comment { display: flex; gap: 12px; margin-bottom: 16px; }
    .comment-body { min-width: 0; }
    .comment-head { font-size: 12px; color: var(--muted); }
    .comment-head strong { color: var(--text); font-size: 13px; margin-right: 6px; }
    .comment-text { white-space: pre-wrap; word-break: break-word; margin-top: 4px; line-height: 1.5; }
    .side-card { display: flex; gap: 8px; cursor: pointer; border-radius: 8px; }
    .side-card:hover { background: var(--bg-3); }
    .side-thumb {
      position: relative;
      width: 168px;
      aspect-ratio: 16 / 9;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .side-thumb .duration { font-size: 11px; padding: 1px 4px; }
    .side-info { min-width: 0; }
    .side-info .card-title { font-size: 13px; }

    /* Shorts */
    .shorts-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 16px; }
    .shorts-stage { display: flex; gap: 16px; align-items: center; }
    .shorts-frame {
      position: relative;
      height: min(640px, calc(100vh - 150px));
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    .shorts-frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    .shorts-side { display: flex; flex-direction: column; gap: 12px; }
    .s-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--bg-3);
      font-size: 16px;
    }
    .s-btn:hover { background: #3f3f46; }
    .shorts-info { width: min(360px, 80vw); margin-top: 12px; }
    .s-title { font-weight: 700; font-size: 15px; line-height: 1.4; margin-bottom: 6px; }
    .s-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    /* Channel page */
    .ch-page { padding-top: 16px; }
    .banner {
      height: 160px;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #b91c1c, #27272a);
    }
    .ch-head { display: flex; gap: 16px; align-items: center; margin-top: 16px; flex-wrap: wrap; }

    /* Credits (YouTube の説明パネル風) */
    .cr-wrap { display: grid; place-items: start center; padding-top: 24px; }
    .cr-dialog {
      width: 100%;
      max-width: 720px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .cr-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 12px 24px;
      border-bottom: 1px solid var(--border);
    }
    .cr-head h2 { font-size: 18px; font-weight: 700; }
    .cr-body { padding: 8px 24px 20px; max-height: 70vh; overflow-y: auto; }
    .cr-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #27272a;
      line-height: 1.6;
    }
    .cr-row:last-child { border-bottom: none; }
    .cr-label { color: var(--muted); font-size: 13px; }
    .cr-value { font-size: 14px; word-break: break-word; }

    /* Notifications */
    .notify-panel {
      position: fixed;
      top: 56px;
      right: 12px;
      width: 360px;
      max-width: calc(100vw - 24px);
      max-height: 70vh;
      overflow-y: auto;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      z-index: 30;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .notify-panel.open { display: block; }
    .notify-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    .notify-item { padding: 12px 16px; border-bottom: 1px solid #27272a; cursor: pointer; font-size: 13px; line-height: 1.5; }
    .notify-item:hover { background: var(--bg-3); }
    .notify-item .time { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .link-btn { color: var(--red-light); font-size: 13px; }

    /* Settings modal */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      place-items: center;
      z-index: 40;
      padding: 16px;
    }
    .modal-backdrop.open { display: grid; }
    .modal {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-size: 18px; margin-bottom: 12px; }
    .modal h3 { font-size: 14px; margin: 16px 0 8px; }
    .opt {
      display: flex;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      line-height: 1.5;
    }
    .opt:has(input:checked) { border-color: var(--red); }
    .opt small { color: var(--muted); display: block; margin-top: 4px; }
    .srv-list { font-size: 12px; color: var(--muted); margin: 8px 0 0 20px; line-height: 1.8; }
    .row-set {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }
    .row-set select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border-radius: 8px; background: var(--bg-3); }
    .btn.primary { background: var(--red); color: #fff; font-weight: 600; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #f4f4f5;
      color: #09090b;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 50;
    }
    .toast.show { opacity: 1; }

    /* Responsive */
    @media (max-width: 1100px) {
      .watch { flex-direction: column; }
      .watch-side { width: 100%; }
    }
    @media (max-width: 1023px) {
      aside { display: none; }
      aside.show {
        display: block;
        position: fixed;
        top: 56px;
        left: 0;
        z-index: 25;
        background: var(--bg);
        width: 240px;
        height: calc(100vh - 56px);
      }
      main { padding: 8px 12px 24px; }
    }
    @media (max-width: 767px) {
      .search { display: none; }
      .search-mobile { display: grid; }
      .watch-side .side-thumb { width: 140px; }
      .cr-row { grid-template-columns: 1fr; gap: 4px; }
      .shorts-frame { height: calc(100vh - 220px); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn" id="menuBtn" aria-label="メニュー">☰</button>
      <div class="logo" data-go="#/home">
        <div class="logo-mark"></div>
        <span>Apple-tube</span>
      </div>
    </div>

    <div class="search">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="検索">
        <button id="searchBtn" aria-label="検索">🔍</button>
      </div>
      <button class="icon-btn mic-btn" aria-label="音声検索">🎤</button>
    </div>

    <div class="header-right">
      <button class="icon-btn search-mobile" id="mobileSearchBtn" aria-label="検索">🔍</button>
      <button class="icon-btn" aria-label="作成">📹</button>
      <button class="icon-btn" id="bellBtn" aria-label="通知">🔔<span class="notify-dot" id="notifyDot"></span></button>
      <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button>
      <div class="avatar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="5"/>
          <path d="M20 21a8 8 0 0 0-16 0"/>
        </svg>
      </div>
    </div>
  </header>

  <div class="search-mobile-row" id="mSearch">
    <input type="text" id="searchInputM" placeholder="検索">
  </div>

  <div class="notify-panel" id="notifyPanel"></div>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal" role="dialog" aria-modal="true">
      <h2>設定：読み込み方法</h2>
      <label class="opt">
        <input type="radio" name="mode" value="download">
        <div>
          標準：ダウンロードして再生
          <small>動画を一時保存してから再生します。保存期間を過ぎるか、別の動画に移動すると削除されます。保存できない場合は直接再生に切り替わります。</small>
        </div>
      </label>
      <label class="opt">
        <input type="radio" name="mode" value="stream">
        <div>
          直接ストリーミング再生
          <small>保存せず、取得したURLから直接再生します。画質の切り替え、映像と音声の分離再生、取得先の自動切替に対応します。</small>
        </div>
      </label>
      <label class="opt">
        <input type="radio" name="mode" value="auto">
        <div>
          自動選択（従来）
          <small>redirect.invidious.io に問い合わせて、利用可能なサーバへ自動で振り分けます。失敗した場合はサーバ一覧を上から順に試行します。</small>
        </div>
      </label>
      <label class="opt">
        <input type="radio" name="mode" value="server">
        <div>
          サーバ試行（従来）
          <small>下のサーバ一覧を上から順に試し、取得できた時点でそのサーバを使用します。</small>
        </div>
      </label>
      <p class="card-meta" id="curBase"></p>

  <script>
    const GAS_PROXY = '';

    const INSTANCES = [

      'invidious-f5-si.zproxy.org',

      'invidious.nerdvpn.de',

      'invidious.privacydev.net',

      'invidious.tiekoetter.com',

    ];
    const REDIRECT = 'https://redirect.invidious.io';

    const SHORT_QUERIES = ['#shorts', 'shorts 人気', 'ショート 面白い', '#shorts 話題', 'shorts ゲーム', 'shorts 音楽', 'shorts 料理', 'shorts 日本'];
    // クレジット画面の内容（ここを書き換えてください）
    const CREDIT_AUTHOR = 'Mugis-Green-Apple';
    const CREDIT_ROWS = [
      ['アプリ名', 'Apple-tube'],
      ['バージョン', 'v4'],
      ['作成者', CREDIT_AUTHOR],
      ['動画データ', 'Invidious'],
      ['サムネイル', 'i.ytimg.com'],
      ['再生方式', 'ダウンロード保存/ストリーミング再生/'],
      ['協力', 'Proxoo-team'],
      ['AI補正', 'GPT-6 Luna'],
      ['UI参考', 'YouTube'],
      ['注意', '非公式クライアントです。YouTube・Invidious とは提携していません。動画の保存は各サービスの利用規約と著作権法を必ず確認してください。'],
      ['連絡', '再生できなかった場合はMugis-Green-AppleもしくはProxoo-teamにご連絡ください']

    ];

    const CATS = [
      { label: 'すべて' },
      { label: 'ゲーム', q: 'ゲーム' },
      { label: 'ライブ', q: 'ライブ配信', live: true },
      { label: '音楽', q: '音楽' },
      { label: 'ニュース', q: 'ニュース' },

      { label: '料理', q: '料理' },
      { label: 'ドキュメンタリー', q: 'ドキュメンタリー' }
    ];
    const PALETTE = ['#b91c1c', '#4338ca', '#ea580c', '#0e7490', '#7e22ce', '#047857', '#a16207', '#1e40af'];

    const state = {
      mode: localStorage.getItem('apt_mode') || 'download',   // 'download' | 'stream' | 'auto' | 'server'
      keepMin: Number(localStorage.getItem('apt_keep') || 30),
      purge: localStorage.getItem('apt_purge') !== 'off',
      subs: JSON.parse(localStorage.getItem('apt_subs') || '[]'),
      notes: [],
      unread: 0,
      cat: 'すべて',
      base: null,
      lastOrigin: null,  
      curWatch: null,
      blobUrl: null,
      dl: null
    };
    const pb = {
      gen: 0,            
      streams: [],
      candidates: [],    
      audio: null,       
      cur: null,         
      retry: null,       
      wantPlay: false,   
      wd: null,          
      stallWd: null      
    };
    const shortsState = { list: [], idx: 0, seen: new Set(), loading: false, qi: 0 };
    let token = 0;
    let toastTimer;
    const seenNotes = new Set();

    /* ===== ユーティリティ ===== */
    const $ = s => document.querySelector(s);
    const main = $('#main');
    const enc = encodeURIComponent;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const colorOf = id => PALETTE[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % PALETTE.length];

    function absUrl(u) {
      if (!u) return '';
      if (u.startsWith('//')) return 'https:' + u;
      if (u.startsWith('/')) return (state.base || 'https://' + INSTANCES[0]) + u;
      return u;
    }
    const avatarUrl = arr => (Array.isArray(arr) && arr.length) ? absUrl(arr[arr.length - 1].url) : '';

    const avatarHTML = (url, cls, attrs = '') =>
      `<span class="${cls}" ${attrs}>${url ? `<img src="${esc(url)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.remove()">` : ''}</span>`;

    function fmtDur(s) {
      if (!s) return '';
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      const p = n => String(n).padStart(2, '0');
      return h ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
    }

    function fmtCount(n) {
      if (n == null) return '';
      if (n >= 100000000) return (n / 100000000).toFixed(1).replace(/\.0$/, '') + '億';
      if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
      return Number(n).toLocaleString('ja-JP');
    }

    function fmtBytes(b) {
      if (!b) return '0 B';
      if (b >= 1048576) return (b / 1048576).toFixed(1) + ' MB';
      if (b >= 1024) return (b / 1024).toFixed(0) + ' KB';
      return b + ' B';
    }

    const viewsText = (n, live) => n == null ? '' : `${fmtCount(n)}${live ? '人が視聴中' : '回視聴'}`;

    function timeAgo(ts, fallback = '') {
      if (!ts) return fallback;
      const s = Math.floor(Date.now() / 1000 - ts);
      if (s < 60) return 'たった今';
      const units = [[31536000, '年'], [2592000, 'か月'], [86400, '日'], [3600, '時間'], [60, '分']];
      for (const [sec, label] of units) {
        if (s >= sec) return `${Math.floor(s / sec)}${label}前`;
      }
      return fallback;
    }

    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    /* ===== 一時保存（IndexedDB） ===== */
    const DB_NAME = 'apple-tube';
    const STORE = 'videos';
    let dbPromise = null;

    function openDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: 'id' });
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return dbPromise;
    }
    async function getStore(mode) {
      const db = await openDB();
      return db.transaction(STORE, mode).objectStore(STORE);
    }
    const reqP = req => new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    async function cachePut(rec) { return reqP((await getStore('readwrite')).put(rec)); }
    async function cacheGet(id) { return reqP((await getStore('readonly')).get(id)); }
    async function cacheDel(id) { return reqP((await getStore('readwrite')).delete(id)); }
    async function cacheAll() { return reqP((await getStore('readonly')).getAll()); }

    // keep で指定した動画以外をすべて削除（null なら全削除）
    async function purgeCache(keep) {
      const all = await cacheAll();
      for (const r of all) {
        if (r.id !== keep) await cacheDel(r.id);
      }
    }
    // 期限切れを削除
    async function expireCache() {
      const all = await cacheAll();
      const now = Date.now();
      for (const r of all) {
        if (r.expiresAt <= now) await cacheDel(r.id);
      }
    }
    function revokeBlob() {
      if (state.blobUrl) {
        URL.revokeObjectURL(state.blobUrl);
        state.blobUrl = null;
      }
    }

    /* ===== API ===== */
    async function fetchJSON(url) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data && data.error) throw new Error(String(data.error));
        return { data, origin: res.url ? new URL(res.url).origin : null };
      } finally {
        clearTimeout(timer);
      }
    }

    // 候補を上から順に試す（GASは最後の予備）
    // opts.exclude: 試さないインスタンスのオリジンの Set（自動切替用）
    async function api(path, opts = {}) {
      const exclude = opts.exclude || null;
      const list = [];
      if (state.mode === 'auto' && !exclude) list.push({ url: REDIRECT + path, gas: false });
      INSTANCES.forEach(h => {
        const origin = 'https://' + h;
        if (!exclude || !exclude.has(origin)) list.push({ url: origin + path, gas: false });
      });
      if (GAS_PROXY && !exclude) list.push({ url: GAS_PROXY + '?path=' + enc(path), gas: true });

      for (const c of list) {
        try {
          const { data, origin } = await fetchJSON(c.url);
          state.lastOrigin = origin;
          if (!c.gas && origin) state.base = origin;
          return data;
        } catch (e) {
          // 次の候補へ
        }
      }
      addNote('サーバに接続できませんでした。⚙設定で読み込み方法を変更できます。');
      throw new Error('all instances failed');
    }

    /* ===== 通知 ===== */
    function addNote(text, link) {
      state.notes.unshift({ text, link, time: Date.now() });
      state.notes = state.notes.slice(0, 50);
      state.unread++;
      updateBell();
    }
    function updateBell() {
      $('#notifyDot').style.display = state.unread ? 'block' : 'none';
    }
    function renderNotify() {
      const items = state.notes.length
        ? state.notes.map(n => `
            <div class="notify-item" ${n.link ? `data-go="${esc(n.link)}"` : ''}>
              ${esc(n.text)}
              <div class="time">${timeAgo(Math.floor(n.time / 1000))}</div>
            </div>`).join('')
        : '<div class="notify-item">お知らせはありません</div>';
      $('#notifyPanel').innerHTML = `
        <div class="notify-head">
          <span>お知らせ</span>
          <button class="link-btn" id="readAll">すべて既読</button>
        </div>${items}`;
    }
    function noteFromSubs(v) {
      if (isSub(v.authorId) && !seenNotes.has(v.videoId)) {
        seenNotes.add(v.videoId);
        addNote(`登録チャンネル「${v.author}」の動画「${v.title}」があります`, `#/watch/${v.videoId}`);
      }
    }

    /* ===== 登録チャンネル ===== */
    const isSub = id => state.subs.some(s => s.id === id);
    function toggleSub(ch) {
      if (isSub(ch.id)) {
        state.subs = state.subs.filter(s => s.id !== ch.id);
        toast('登録を解除しました');
      } else {
        state.subs.push(ch);
        addNote(`「${ch.name}」を登録しました`, `#/channel/${ch.id}`);
        toast('登録しました');
      }
      localStorage.setItem('apt_subs', JSON.stringify(state.subs));
      renderSidebarSubs();
      return isSub(ch.id);
    }
    function renderSidebarSubs() {
      $('#subList').innerHTML = state.subs.length
        ? state.subs.map(s => `
            <button class="channel-item" data-go="#/channel/${esc(s.id)}">
              ${avatarHTML(s.avatar, 'av')}
              <span class="ellipsis">${esc(s.name)}</span>
            </button>`).join('')
        : '<p class="card-meta" style="padding:0 12px">登録チャンネルはありません</p>';
    }

    /* ===== 共通パーツ ===== */
    const catObj = label => CATS.find(c => c.label === label) || CATS[0];
    const errorHTML = () => `<div class="empty">読み込みに失敗しました<br><button class="retry-btn" data-retry>再試行</button></div>`;

    function videoCard(v) {
      const id = v.videoId;
      const dur = v.liveNow ? 'LIVE' : fmtDur(v.lengthSeconds);
      const meta = [viewsText(v.viewCount, v.liveNow), timeAgo(v.published, v.publishedText)].filter(Boolean).join(' · ');
      return `
        <article class="card" data-go="#/watch/${esc(id)}">
          <div class="thumb" style="background:linear-gradient(135deg, ${colorOf(id)}, #27272a)">
            <img src="https://i.ytimg.com/vi/${esc(id)}/mqdefault.jpg" alt="" loading="lazy">
            <div class="play-overlay"><div class="play-circle">▶</div></div>
            ${dur ? `<span class="duration ${v.liveNow ? 'live' : ''}">${esc(dur)}</span>` : ''}
          </div>
          <div class="card-body">
            ${avatarHTML(avatarUrl(v.authorThumbnails), 'card-avatar', v.authorId ? `data-go="#/channel/${esc(v.authorId)}"` : '')}
            <div style="min-width:0">
              <h3 class="card-title">${esc(v.title)}</h3>
              <p class="card-channel" ${v.authorId ? `data-go="#/channel/${esc(v.authorId)}"` : ''}>${esc(v.author)}</p>
              <p class="card-meta">${esc(meta)}</p>
            </div>
          </div>
        </article>`;
    }

    function sideCard(r) {
      const dur = r.liveNow ? 'LIVE' : fmtDur(r.lengthSeconds);
      const meta = [viewsText(r.viewCount, r.liveNow), timeAgo(r.published, r.publishedText)].filter(Boolean).join(' · ');
      return `
        <div class="side-card" data-go="#/watch/${esc(r.videoId)}">
          <div class="side-thumb" style="background:linear-gradient(135deg, ${colorOf(r.videoId)}, #27272a)">
            <img src="https://i.ytimg.com/vi/${esc(r.videoId)}/mqdefault.jpg" alt="" loading="lazy">
            <span class="duration ${r.liveNow ? 'live' : ''}">${esc(dur)}</span>
          </div>
          <div class="side-info">
            <h3 class="card-title">${esc(r.title)}</h3>
            <p class="card-channel">${esc(r.author)}</p>
            <p class="card-meta">${esc(meta)}</p>
          </div>
        </div>`;
    }

    function channelRow(c) {
      return `
        <div class="channel-row" data-go="#/channel/${esc(c.authorId)}">
          ${avatarHTML(avatarUrl(c.authorThumbnails), 'av-lg')}
          <div style="min-width:0">
            <p class="ch-name">${esc(c.author)}</p>
            <p class="card-meta">${c.subCount != null ? `登録者数 ${esc(fmtCount(c.subCount))}人` : ''}</p>
            <p class="card-meta clamp">${esc(c.description || '')}</p>
          </div>
        </div>`;
    }

    /* ===== ホーム / トレンド ===== */
    function renderChips() {
      return `<div class="chips">${CATS.map(c =>
        `<button class="chip ${c.label === state.cat ? 'active' : ''}" data-cat="${esc(c.label)}">${esc(c.label)}</button>`
      ).join('')}</div>`;
    }

    function renderFeedPage(my, withChips) {
      main.innerHTML = (withChips ? renderChips() : '') + '<div class="grid" id="grid"></div>';
      return loadFeed(my, withChips ? catObj(state.cat) : null);
    }

    async function loadFeed(my, cat) {
      const grid = $('#grid');
      grid.innerHTML = '<div class="empty">読み込み中…</div>';
      try {
        let items = (cat && cat.q)
          ? await api(`/api/v1/search?q=${enc(cat.q)}&type=video&region=JP&hl=ja`)
          : await api(`/api/v1/trending?region=JP&hl=ja`);
        if (my !== token) return;
        items = items.filter(x => x.videoId && (cat && cat.live ? x.liveNow : true));
        items.forEach(noteFromSubs);
        grid.innerHTML = items.length ? items.map(videoCard).join('') : '<div class="empty">該当する動画はありません</div>';
      } catch (e) {
        if (my !== token) return;
        grid.innerHTML = errorHTML();
      }
    }

    /* ===== 検索 ===== */
    async function renderSearch(my, q) {
      main.innerHTML = `
        <h2 class="page-title">${q ? `「${esc(q)}」の検索結果` : '検索'}</h2>
        <div id="sChan"></div>
        <div class="grid" id="grid"></div>`;
      if (!q) {
        $('#grid').innerHTML = '<div class="empty">検索ワードを入力してください</div>';
        return;
      }
      $('#grid').innerHTML = '<div class="empty">読み込み中…</div>';
      try {
        const items = await api(`/api/v1/search?q=${enc(q)}&type=all&region=JP&hl=ja`);
        if (my !== token) return;
        const chans = items.filter(i => i.type === 'channel' && i.authorId).slice(0, 3);
        const vids = items.filter(i => i.type === 'video' && i.videoId);
        $('#sChan').innerHTML = chans.map(channelRow).join('');
        $('#grid').innerHTML = vids.length ? vids.map(videoCard).join('') : '<div class="empty">該当する動画はありません</div>';
      } catch (e) {
        if (my !== token) return;
        $('#grid').innerHTML = errorHTML();
      }
    }


    // 指定の itag を優先して形式を選ぶ（保存用）
    function pickFormat(v, prefer) {
      const fmts = (v.formatStreams || []).filter(f => f.url);
      for (const itag of prefer) {
        const hit = fmts.find(f => String(f.itag) === itag);
        if (hit) return hit;
      }
      return fmts[fmts.length - 1] || null;
    }

    // 対応している MIME タイプか
    function supportsType(type) {
      if (!type) return true;
      const probe = document.createElement('video');
      return probe.canPlayType(type) !== '';
    }

    // 解像度の数値（例：1080p60 → 1080）
    function qualityOf(s) {
      const text = String(s.qualityLabel || s.resolution || s.quality || '');
      const m = text.match(/(\d{3,4})p/i) || text.match(/x(\d{3,4})/i);
      return m ? Number(m[1]) : 0;
    }
    function labelOf(s) {
      const q = qualityOf(s);
      return q ? q + 'p' : (s.qualityLabel || s.resolution || '標準');
    }

    // 再生候補を作る（音声付きの形式と、映像のみ＋音声の組み合わせ）
    function buildPlayable(v, origin) {
      const abs = u => (/^https?:/.test(u) ? u : (origin ? origin + u : ''));
      const toStream = (f, progressive) => ({
        url: abs(String(f.url || '')),
        type: String(f.type || (progressive ? 'video/mp4' : '')).split(';')[0],
        q: qualityOf(f),
        label: labelOf(f),
        bitrate: Number(f.bitrate) || 0,
        progressive
      });
      const formats = Array.isArray(v.formatStreams) ? v.formatStreams : [];
      const adaptive = Array.isArray(v.adaptiveFormats) ? v.adaptiveFormats : [];
      const audios = adaptive
        .filter(f => f.url && /^audio\//i.test(f.type || ''))
        .map(f => toStream(f, false))
        .filter(s => s.url)
        .sort((a, b) => Number(supportsType(b.type)) - Number(supportsType(a.type)) || b.bitrate - a.bitrate);
      const audio = audios[0] || null;
      const progressive = formats
        .filter(f => f.url && !/^audio\//i.test(f.type || ''))
        .map(f => toStream(f, true))
        .filter(s => s.url);
      // 映像のみは音声が無いと使えない
      const videoOnly = audio
        ? adaptive
            .filter(f => f.url && /^video\//i.test(f.type || ''))
            .map(f => toStream(f, false))
            .filter(s => s.url && s.q > 0)
        : [];
      const videos = [...progressive, ...videoOnly].sort((a, b) =>
        Number(supportsType(b.type)) - Number(supportsType(a.type))
        || b.q - a.q
        || Number(b.progressive) - Number(a.progressive));
      return { videos, audio };
    }

    // 同じ画質の重複を除く（先頭＝音声付き・対応形式を優先）
    function uniqueByLabel(list) {
      const seen = new Set();
      return list.filter(s => {
        if (seen.has(s.label)) return false;
        seen.add(s.label);
        return true;
      });
    }

    // 既定の画質（720p 以下の音声付きを優先）
    function defaultStream() {
      return pb.streams.find(s => s.progressive && s.q > 0 && s.q <= 720)
        || pb.streams.find(s => s.q > 0 && s.q <= 720)
        || pb.streams[0]
        || null;
    }

    function renderQuality(streams, selected) {
      const sel = $('#qSelect');
      if (!sel) return;
      sel.innerHTML = streams.length
        ? streams.map((s, i) => `<option value="${i}">${esc(s.label)}${s.progressive ? '（音声付き）' : '（映像のみ）'}</option>`).join('')
        : '<option>画質情報なし</option>';
      sel.disabled = streams.length < 2;
      const idx = selected ? streams.findIndex(s => s.label === selected.label) : -1;
      if (idx >= 0) sel.value = String(idx);
    }

    function setBadge(text) {
      const badge = $('#pBadge');
      if (!badge) return;
      badge.textContent = text || '';
      badge.classList.toggle('hidden', !text);
    }

    function setLoading(on, text = '動画を読み込み中…', opts = {}) {
      const box = $('#pLoading');
      if (!box) return;
      box.classList.toggle('hidden', !on);
      $('#pLoadingText').textContent = text;
      $('#pTrack').classList.toggle('hidden', opts.progress === undefined);
      if (opts.progress !== undefined) $('#pBar').style.width = opts.progress + '%';
      $('#pCancel').classList.toggle('hidden', !opts.cancellable);
    }

    const pVideo = () => $('#pVideo');
    const pAudio = () => $('#pAudio');

    function clearWatchdogs() {
      clearTimeout(pb.wd);
      clearTimeout(pb.stallWd);
      pb.wd = null;
      pb.stallWd = null;
    }

    // 読み込みが 15 秒以上進まなければ別のソースへ
    function armWatchdog() {
      clearTimeout(pb.wd);
      const gen = pb.gen;
      pb.wd = setTimeout(() => {
        pb.wd = null;
        const video = pVideo();
        if (video && gen === pb.gen && video.readyState < (pb.wantPlay ? 2 : 1)) retryPlayback();
      }, 15000);
    }

    // 再生中に止まり続けたら別のソースへ
    function armStallWatchdog() {
      clearTimeout(pb.stallWd);
      if (!pb.wantPlay) return;
      const gen = pb.gen;
      pb.stallWd = setTimeout(() => {
        pb.stallWd = null;
        const video = pVideo();
        if (video && gen === pb.gen && pb.wantPlay && video.readyState < 3) retryPlayback();
      }, 15000);
    }

    // 映像のずれを音声で補正
    function syncAudio() {
      const video = pVideo(), audio = pAudio();
      if (!video || !audio || !audio.getAttribute('src')) return;
      if (!Number.isFinite(video.currentTime) || audio.readyState < 1) return;
      const drift = video.currentTime - audio.currentTime;
      if (!Number.isFinite(drift)) return;
      if (Math.abs(drift) > 0.9) {
        try { audio.currentTime = video.currentTime; } catch (_) {}
      }
      audio.playbackRate = !video.paused && Math.abs(drift) > 0.04
        ? video.playbackRate * Math.min(1.04, Math.max(0.96, 1 + drift * 0.08))
        : video.playbackRate;
    }

    // ストリームを読み込んで再生する
    function playStream(stream, opts = {}) {
      const video = pVideo(), audio = pAudio();
      if (!video || !audio || !stream?.url) return;
      const gen = ++pb.gen;
      const resume = pb.wantPlay || !video.paused;
      const keep = opts.keepTime ? video.currentTime : 0;
      pb.cur = stream;
      if (pb.retry) pb.retry.tried.add(stream.url);
      clearWatchdogs();
      setBadge(stream.saved ? '保存済み（一時キャッシュ）' : 'ストリーミング');
      setLoading(true, opts.keepTime ? '画質を切り替えています…' : '動画を読み込み中…');

      if (stream.progressive || !pb.audio) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
      } else {
        audio.src = pb.audio.url;
        audio.load();
        audio.volume = video.volume;
        audio.muted = video.muted;
        audio.playbackRate = video.playbackRate;
      }

      video.addEventListener('loadedmetadata', () => {
        if (gen !== pb.gen) return;
        if (keep && Number.isFinite(video.duration)) {
          video.currentTime = Math.min(keep, video.duration);
        }
        syncAudio();
        if (resume || !opts.keepTime) {
          video.play().catch(() => toast('自動再生できませんでした。再生ボタンを押してください'));
        }
      }, { once: true });

      video.src = stream.url;
      video.load();
      armWatchdog();
    }

    // 別の候補・別のインスタンスへ自動切替し、だめなら埋め込みへ
    async function retryPlayback() {
      const r = pb.retry;
      const video = pVideo();
      if (!r || !video || r.busy) return;
      const resume = pb.wantPlay || !video.paused;
      r.busy = true;
      clearWatchdogs();
      setLoading(true, '別のAPI・動画ソースを探しています…');
      try {
        let next = pb.candidates.find(s => !r.tried.has(s.url));
        while (!next && r.hops < 3 && pb.retry === r) {
          r.hops += 1;
          let data;
          try {
            data = await api(`/api/v1/videos/${enc(r.id)}?hl=ja`, { exclude: r.origins });
          } catch (e) {
            break;
          }
          if (pb.retry !== r) return;
          const origin = state.lastOrigin;
          if (origin) r.origins.add(origin);
          const built = buildPlayable(data, origin);
          pb.streams = uniqueByLabel(built.videos);
          pb.candidates = built.videos;
          pb.audio = built.audio;
          next = built.videos.find(s => !r.tried.has(s.url));
        }
        if (pb.retry !== r) return;
        if (!next) {
          showEmbed(r.id, r.origin, '再生できないため、埋め込み表示に切り替えました');
          return;
        }
        renderQuality(pb.streams, next);
        playStream(next, { keepTime: true, resume });
        toast('別のソースへ自動切替しました');
      } catch (e) {
        if (pb.retry === r && e.name !== 'AbortError') {
          showEmbed(r.id, r.origin, '再生できないため、埋め込み表示に切り替えました');
        }
      } finally {
        r.busy = false;
      }
    }

    // 最後の手段：埋め込み（iframe）
    function showEmbed(id, origin, message) {
      pb.gen++;
      clearWatchdogs();
      pb.retry = null;
      const video = pVideo(), audio = pAudio();
      if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
      if (audio) { audio.pause(); audio.removeAttribute('src'); audio.load(); }
      const base = origin || 'https://' + INSTANCES[0];
      const box = $('#playerBox');
      if (box) {
        box.innerHTML = `<iframe src="${esc(`${base}/embed/${enc(id)}`)}" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
      }
      if (message) toast(message);
    }

    // 保存済みの動画（Blob）を再生
    function playSaved(blob) {
      revokeBlob();
      state.blobUrl = URL.createObjectURL(blob);
      state.dl = null;
      playStream({ url: state.blobUrl, progressive: true, label: '保存済み', q: 0, saved: true });
    }

    // 保存用：360p（itag 18）を取得して IndexedDB に保存
    async function downloadVideo(v, origin, my) {
      const pick = pickFormat(v, ['18', '22']);
      if (!pick) throw new Error('no-format');
      const url = /^https?:/.test(pick.url) ? pick.url : (origin ? origin + pick.url : '');
      if (!url) throw new Error('no-url');

      const ctrl = new AbortController();
      state.dl = { ctrl, id: v.videoId };
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const total = Number(res.headers.get('content-length')) || Number(pick.size) || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let got = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (my !== token) {
          ctrl.abort();
          throw new Error('cancel');
        }
        chunks.push(value);
        got += value.length;
        const pct = total ? Math.floor(got / total * 100) : 0;
        setLoading(true,
          total ? `ダウンロード中 ${pct}%` : `ダウンロード中 ${fmtBytes(got)}`,
          { progress: total ? pct : 50, cancellable: true });
      }

      const type = pick.type ? pick.type.split(';')[0] : 'video/mp4';
      const blob = new Blob(chunks, { type });
      await cachePut({
        id: v.videoId,
        blob,
        title: v.title,
        savedAt: Date.now(),
        expiresAt: Date.now() + state.keepMin * 60 * 1000
      });
      state.dl = null;
      return blob;
    }

    // 動画の再生を開始する（モードに応じて保存再生／ストリーミング）
    async function startPlayback(v, origin, my) {
      const built = buildPlayable(v, origin);
      pb.streams = uniqueByLabel(built.videos);
      pb.candidates = built.videos;
      pb.audio = built.audio;
      pb.retry = {
        id: v.videoId,
        origin,
        origins: new Set(origin ? [origin] : []),
        tried: new Set(),
        busy: false,
        hops: 0
      };
      const first = defaultStream();
      renderQuality(pb.streams, first);

      if (v.liveNow || !first) {
        showEmbed(v.videoId, origin);
        return;
      }
      if (state.mode !== 'download') {
        playStream(first);
        return;
      }

      const cached = await cacheGet(v.videoId).catch(() => null);
      if (my !== token) return;
      if (cached && cached.expiresAt > Date.now()) {
        playSaved(cached.blob);
        return;
      }

      setLoading(true, 'ダウンロード準備中…', { progress: 0, cancellable: true });
      try {
        const blob = await downloadVideo(v, origin, my);
        if (my !== token) return;
        playSaved(blob);
      } catch (e) {
        state.dl = null;
        if (my !== token) return;
        toast(e.name === 'AbortError' ? '直接再生に切り替えます' : '保存できなかったため、直接再生します');
        playStream(first);
      }
    }

    // 動画プレイヤーのイベントを設定する
    function bindPlayerEvents() {
      const video = pVideo(), audio = pAudio();
      if (!video || !audio) return;
      video.addEventListener('error', () => {
        if (video.getAttribute('src')) retryPlayback();
      });
      video.addEventListener('waiting', () => {
        setLoading(true, 'バッファリング中…');
        audio.pause();
        armStallWatchdog();
      });
      video.addEventListener('stalled', () => {
        setLoading(true, '接続を待っています…');
        armStallWatchdog();
      });
      const ready = () => {
        clearWatchdogs();
        setLoading(false);
      };
      video.addEventListener('loadeddata', ready);
      video.addEventListener('canplay', ready);
      video.addEventListener('playing', () => {
        ready();
        if (audio.getAttribute('src')) {
          syncAudio();
          audio.play().catch(() => {});
        }
      });
      video.addEventListener('play', () => {
        pb.wantPlay = true;
        armStallWatchdog();
        if (audio.getAttribute('src')) {
          syncAudio();
          audio.play().catch(() => {});
        }
      });
      video.addEventListener('pause', () => {
        if (!video.ended && !(pb.retry && pb.retry.busy)) pb.wantPlay = false;
        audio.pause();
      });
      video.addEventListener('ended', () => {
        pb.wantPlay = false;
        audio.pause();
        audio.currentTime = 0;
      });
      ['seeking', 'seeked', 'timeupdate'].forEach(name => video.addEventListener(name, syncAudio));
      video.addEventListener('ratechange', () => { audio.playbackRate = video.playbackRate; });
      video.addEventListener('volumechange', () => {
        audio.volume = video.volume;
        audio.muted = video.muted;
      });
      audio.addEventListener('loadedmetadata', syncAudio);
      audio.addEventListener('canplay', () => {
        syncAudio();
        if (!video.paused && !video.ended) audio.play().catch(() => {});
      });
    }

    // 画面を離れるときに再生を止める
    function stopPlayer() {
      pb.gen++;
      clearWatchdogs();
      pb.retry = null;
      pb.wantPlay = false;
      pb.cur = null;
      pb.streams = [];
      pb.candidates = [];
      pb.audio = null;
      const video = pVideo(), audio = pAudio();
      if (video) { video.pause(); video.removeAttribute('src'); video.load(); }
      if (audio) { audio.pause(); audio.removeAttribute('src'); audio.load(); }
      setLoading(false);
    }

    /* ===== ショート ===== */
    async function renderShorts(my) {
      main.innerHTML = `
        <div class="shorts-wrap">
          <div class="shorts-stage">
            <div class="shorts-frame" id="sFrame"><div class="player-msg">ショートを読み込み中…</div></div>
            <div class="shorts-side">
              <button class="s-btn" id="sPrev" aria-label="前のショート">▲</button>
              <button class="s-btn" id="sNext" aria-label="次のショート">▼</button>
            </div>
          </div>
          <div class="shorts-info" id="sInfo"></div>
        </div>`;

      Object.assign(shortsState, { list: [], idx: 0, seen: new Set(), loading: false });

      // 1回で見つからなければ最大3回まで取り直す
      for (let k = 0; k < 3 && !shortsState.list.length; k++) {
        await loadShortsMore(my);
        if (my !== token) return;
      }
      if (!shortsState.list.length) {
        const f = $('#sFrame');
        if (f) f.innerHTML = '<div class="player-msg">ショートが見つかりませんでした</div>';
        return;
      }
      playShortAt(0, my);
    }

    // ショート候補を追加取得（ショート検索 → だめなら通常検索から90秒以下を抽出）
    async function loadShortsMore(my) {
      if (shortsState.loading) return;
      shortsState.loading = true;
      try {
        const q = SHORT_QUERIES[shortsState.qi++ % SHORT_QUERIES.length];
        let items = [];
        try {
          const d = await api(`/api/v1/search?q=${enc(q)}&type=shorts&hl=ja`);
          items = Array.isArray(d) ? d : (d.videos || []);
        } catch (e) { /* 次へ */ }
        if (!items.length) {
          try {
            const d = await api(`/api/v1/search?q=${enc(q)}&type=video&hl=ja`);
            items = Array.isArray(d) ? d : (d.videos || []);
          } catch (e) { /* 空のまま */ }
        }
        const fresh = items.filter(v =>
          v.videoId &&
          !v.liveNow &&
          ((v.lengthSeconds && v.lengthSeconds <= 90) || /#shorts?/i.test(v.title || '')) &&
          !shortsState.seen.has(v.videoId)
        );
        fresh.forEach(v => { shortsState.seen.add(v.videoId); shortsState.list.push(v); });
      } finally {
        shortsState.loading = false;
      }
    }

    async function playShortAt(i, my) {
      const s = shortsState.list[i];
      if (!s) return;
      shortsState.idx = i;
      const frame = $('#sFrame');
      if (!frame) return;
      frame.innerHTML = '<div class="player-msg">読み込み中…</div>';
      $('#sInfo').innerHTML = `
        <div class="s-title">${esc(s.title)}</div>
        <div class="card-meta">${esc(s.author || '')}${s.viewCount != null ? ' · ' + esc(viewsText(s.viewCount)) : ''}</div>
        <div class="s-hint">${i + 1} / ${shortsState.list.length}　↑↓キー or ▲▼で移動</div>`;

      let d = null;
      try { d = await api(`/api/v1/videos/${enc(s.videoId)}?hl=ja`); } catch (e) { /* 下で処理 */ }
      if (my !== token || !$('#sFrame')) return;

      const fmt = d ? pickFormat(d, ['18', '22']) : null;
      if (!fmt) {
        frame.innerHTML = '<div class="player-msg">再生できませんでした（次へで進めます）</div>';
        return;
      }
      frame.innerHTML = `<video controls autoplay playsinline src="${esc(absUrl(fmt.url))}"></video>`;
      const vid = frame.querySelector('video');
      vid.addEventListener('ended', () => shortsNext(my));
      vid.addEventListener('error', () => {
        frame.innerHTML = '<div class="player-msg">再生エラー（次へで進めます）</div>';
      });

      // 残りが少なくなったら先読み
      if (i >= shortsState.list.length - 3) loadShortsMore(my);
    }

    async function shortsNext(my) {
      const i = shortsState.idx;
      if (i + 1 < shortsState.list.length) return playShortAt(i + 1, my);
      await loadShortsMore(my);
      if (my !== token) return;
      if (i + 1 < shortsState.list.length) playShortAt(i + 1, my);
      else toast('次のショートが見つかりませんでした');
    }

    function shortsPrev(my) {
      if (shortsState.idx > 0) playShortAt(shortsState.idx - 1, my);
    }

    /* ===== ライブラリ ===== */
    function renderLibrary() {
      main.innerHTML = `<h2 class="page-title">登録チャンネル</h2><div class="stack" id="libList"></div>`;
      $('#libList').innerHTML = state.subs.length
        ? state.subs.map(s => `
            <div class="channel-row" data-go="#/channel/${esc(s.id)}">
              ${avatarHTML(s.avatar, 'av-lg')}
              <div><p class="ch-name">${esc(s.name)}</p><p class="card-meta">チャンネルを開く</p></div>
            </div>`).join('')
        : '<div class="empty">まだ登録チャンネルがありません</div>';
    }

    /* ===== クレジット（YouTube の説明パネル風） ===== */
    function renderCredits() {
      main.innerHTML = `
        <div class="cr-wrap">
          <div class="cr-dialog">
            <div class="cr-head">
              <h2>クレジット</h2>
              <button class="icon-btn" data-go="#/home" aria-label="閉じる">✕</button>
            </div>
            <div class="cr-body">
              ${CREDIT_ROWS.map(([k, v]) => `
                <div class="cr-row">
                  <span class="cr-label">${esc(k)}</span>
                  <span class="cr-value">${esc(v)}</span>
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    /* ===== ルーター ===== */
    function setNav(page) {
      document.querySelectorAll('.nav-item[data-go]').forEach(b =>
        b.classList.toggle('active', b.dataset.go === `#/${page}`));
    }

    async function route() {
      const my = ++token;

      // 前の再生を止め、進行中のダウンロードを中断
      stopPlayer();
      revokeBlob();
      if (state.dl) { state.dl.ctrl.abort(); state.dl = null; }

      const [path, qs = ''] = (location.hash.slice(1) || '/home').split('?');
      const [page, id] = path.split('/').filter(Boolean);
      const params = new URLSearchParams(qs);
      const next = page === 'watch' ? (id || '') : null;

      // 別の動画に移動したら、一時保存を整理
      if (state.curWatch !== next && state.purge) {
        purgeCache(next).catch(() => {});
      }
      state.curWatch = next;

      setNav(page);
      $('#notifyPanel').classList.remove('open');

      switch (page) {
        case 'home': return renderFeedPage(my, true);
        case 'trending': return renderFeedPage(my, false);
        case 'shorts': return renderShorts(my);
        case 'search': return renderSearch(my, params.get('q') || '');
        case 'watch': return renderWatch(my, id || '');
        case 'channel': return renderChannel(my, id || '');
        case 'library': return renderLibrary();
        case 'credits': return renderCredits();
        default: location.hash = '#/home';
      }
    }

    function doSearch(q) {
      q = q.trim();
      if (!q) return;
      location.hash = `#/search?q=${enc(q)}`;
    }

    /* ===== 設定 ===== */
    async function refreshCacheInfo() {
      try {
        const all = await cacheAll();
        const bytes = all.reduce((a, r) => a + (r.blob ? r.blob.size : 0), 0);
        $('#cacheInfo').textContent = `一時保存：${all.length}件（${fmtBytes(bytes)}）`;
      } catch (e) {
        $('#cacheInfo').textContent = '保存情報を取得できませんでした';
      }
    }

    function openSettings() {
      document.querySelectorAll('input[name="mode"]').forEach(r => r.checked = (r.value === state.mode));
      $('#setKeep').value = String(state.keepMin);
      $('#setPurge').checked = state.purge;
      $('#curBase').textContent = `現在の接続先：${state.base || '未接続'}`;
      $('#srvList').innerHTML = INSTANCES.map(h => `<li>${esc(h)}</li>`).join('');
      refreshCacheInfo();
      $('#settingsModal').classList.add('open');
    }
    function closeSettings() {
      $('#settingsModal').classList.remove('open');
    }
    function saveSettings() {
      const checked = document.querySelector('input[name="mode"]:checked');
      if (checked) {
        state.mode = checked.value;
        localStorage.setItem('apt_mode', state.mode);
      }
      state.keepMin = Number($('#setKeep').value);
      localStorage.setItem('apt_keep', String(state.keepMin));
      state.purge = $('#setPurge').checked;
      localStorage.setItem('apt_purge', state.purge ? 'on' : 'off');
      closeSettings();
      toast('設定を保存しました');
      route();
    }

    /* ===== イベント ===== */
    document.addEventListener('click', e => {
      const t = e.target;
      const panel = $('#notifyPanel');

      if (t.closest('#bellBtn')) {
        const open = !panel.classList.contains('open');
        if (open) {
          renderNotify();
          state.unread = 0;
          updateBell();
        }
        panel.classList.toggle('open', open);
        return;
      }
      if (t.closest('#readAll')) {
        state.unread = 0;
        updateBell();
        renderNotify();
        return;
      }
      if (!t.closest('#notifyPanel')) panel.classList.remove('open');

      if (t.closest('#settingsBtn')) { openSettings(); return; }
      if (t.closest('#closeSettings') || t.id === 'settingsModal') { closeSettings(); return; }
      if (t.closest('#saveSettings')) { saveSettings(); return; }
      if (t.closest('#clearCache')) {
        purgeCache(null).then(() => { refreshCacheInfo(); toast('一時保存を削除しました'); });
        return;
      }
      if (t.closest('#openCredits')) {
        closeSettings();
        location.hash = '#/credits';
        return;
      }

      if (t.closest('#menuBtn')) {
        const s = $('#sidebar');
        if (window.innerWidth < 1024) s.classList.toggle('show');
        else s.classList.toggle('hidden');
        return;
      }
      if (t.closest('#mobileSearchBtn')) {
        $('#mSearch').classList.toggle('open');
        $('#searchInputM').focus();
        return;
      }
      if (t.closest('#searchBtn')) { doSearch($('#searchInput').value); return; }

      if (t.closest('[data-retry]')) { route(); return; }

      // 取得中の保存をやめて、ストリーミングで再生
      if (t.closest('[data-dl-cancel]')) {
        if (state.dl) state.dl.ctrl.abort();
        return;
      }

      // 動画ページ：直接ストリーミングと保存再生を切り替え
      if (t.closest('[data-toggle-play]')) {
        state.mode = state.mode === 'stream' ? 'download' : 'stream';
        localStorage.setItem('apt_mode', state.mode);
        toast(state.mode === 'stream' ? '直接ストリーミングに切り替えました' : '保存して再生に切り替えました');
        route();
        return;
      }

      // ショート：前後移動
      if (t.closest('#sNext')) { shortsNext(token); return; }
      if (t.closest('#sPrev')) { shortsPrev(token); return; }

      const subBtn = t.closest('[data-sub]');
      if (subBtn) {
        const on = toggleSub({ id: subBtn.dataset.id, name: subBtn.dataset.name, avatar: subBtn.dataset.avatar });
        document.querySelectorAll('[data-sub]').forEach(x => {
          if (x.dataset.id === subBtn.dataset.id) {
            x.classList.toggle('on', on);
            x.textContent = on ? '登録済み' : '登録';
          }
        });
        return;
      }

      const chip = t.closest('[data-cat]');
      if (chip) {
        state.cat = chip.dataset.cat;
        document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.cat === state.cat));
        loadFeed(++token, catObj(state.cat));
        return;
      }

      const go = t.closest('[data-go]');
      if (go) {
        location.hash = go.dataset.go;
        if (window.innerWidth < 1024) $('#sidebar').classList.remove('show');
        return;
      }
    });

    // 画質の切り替え
    document.addEventListener('change', e => {
      if (e.target.id !== 'qSelect') return;
      const s = pb.streams[Number(e.target.value)];
      if (!s || s === pb.cur) return;
      playStream(s, { keepTime: true });
    });

    // ショート表示中は ↑↓ キーで移動
    document.addEventListener('keydown', e => {
      if (!location.hash.startsWith('#/shorts')) return;
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); shortsNext(token); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); shortsPrev(token); }
    });

    $('#searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(e.target.value); });
    $('#searchInputM').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(e.target.value); });

    renderSidebarSubs();
    addNote('Apple-tubeへようこそ！ 読み込み方法は⚙設定から変更できます');
    window.addEventListener('hashchange', route);

    // 期限切れの一時保存を起動時と1分ごとに削除
    expireCache().catch(() => {});
    setInterval(() => expireCache().catch(() => {}), 60 * 1000);

    route();
  </script>
</body>
</html>
